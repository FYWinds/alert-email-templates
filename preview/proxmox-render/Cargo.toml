[package]
name = "proxmox-render"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# proxmox-notify renders with handlebars 5.
handlebars = "5"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
strip = true
