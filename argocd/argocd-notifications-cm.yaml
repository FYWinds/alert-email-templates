# Copyright (c) 2026 FYWinds
#
# Argo CD notifications: HTML emails for sync failures, degraded health,
# comparison errors, and recovery. Merge into argocd-notifications-cm.
# Requires Argo CD >= 3.0 (status.health.lastTransitionTime); tested with 3.5.5.
#
# Replace the example.com values, and put the SMTP password in
# argocd-notifications-secret under the key email-password.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
data:
  # html: every email from this service is sent as text/html.
  service.email.smtp: |
    host: smtp.example.com
    port: 587
    username: alerts@example.com
    password: $email-password
    from: alerts@example.com
    html: true
  # Base URL for the "Open in Argo CD" button and footer link.
  context: |
    argocdUrl: https://argocd.example.com
  # Problem triggers all use oncePer: their entries in the
  # notified.notifications.argoproj.io annotation then outlive the problem
  # (non-oncePer entries are dropped as soon as the condition turns false),
  # which is what on-recovered reads.
  trigger.on-sync-failed: |
    - when: app.status.operationState?.phase in ['Error', 'Failed']
      oncePer: app.status.operationState?.startedAt
      send: [app-alert]
  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      oncePer: app.status.health.lastTransitionTime
      send: [app-alert]
  # ComparisonError (chart repo gone, bad valueFile) leaves no operation to
  # fail and no unhealthy resource: without this the app just sits in Unknown.
  trigger.on-sync-status-unknown: |
    - when: app.status.sync.status == 'Unknown'
      oncePer: >-
        first(filter(app.status.conditions ?? [], .type endsWith 'Error'))?.lastTransitionTime
        ?? app.status.health.lastTransitionTime
      send: [app-alert]
  # Healthy and Synced again after any problem notification above, however the
  # app got there (Degraded -> Progressing -> Healthy included). Fires once per
  # newest problem entry; a routine rollout has none, so it stays quiet.
  trigger.on-recovered: |
    - when: >-
        let st = fromJSON((app.metadata.annotations ?? {})['notified.notifications.argoproj.io'] ?? '{}');
        let ts = map(filter(keys(st), # matches ':on-(sync-failed|health-degraded|sync-status-unknown):'), st[#]);
        app.status.health.status == 'Healthy' && app.status.sync.status == 'Synced'
        && (app.status.operationState?.phase ?? '') not in ['Error', 'Failed']
        && len(ts) > 0
      oncePer: >-
        let st = fromJSON((app.metadata.annotations ?? {})['notified.notifications.argoproj.io'] ?? '{}');
        let ts = map(filter(keys(st), # matches ':on-(sync-failed|health-degraded|sync-status-unknown):'), st[#]);
        string(int(len(ts) > 0 ? max(ts) : 0))
      send: [app-alert]
  # One template for every trigger; the state is read back from the app.
  # Bodies are text/template: escape free text with html.
  template.app-alert: |
    message: |
      {{ .app.metadata.name }}: health {{ dig "status" "health" "status" "" .app }}, sync {{ dig "status" "sync" "status" "" .app }}
      {{ dig "status" "operationState" "message" "" .app }}
    email:
      subject: |-
        {{- $phase := dig "status" "operationState" "phase" "" .app -}}
        {{- $sync := dig "status" "sync" "status" "" .app -}}
        {{- $health := dig "status" "health" "status" "" .app -}}
        {{- if has $phase (list "Error" "Failed") }}🔴 Sync failed
        {{- else if eq $sync "Unknown" }}🟠 Comparison error
        {{- else if eq $health "Degraded" }}🔴 Degraded
        {{- else if and (eq $health "Healthy") (eq $sync "Synced") }}✅ Recovered
        {{- else }}🔵 {{ $health }}{{ end }}: {{ .app.metadata.name }}
      body: |
        {{- $app := .app -}}
        {{- $phase := dig "status" "operationState" "phase" "" $app -}}
        {{- $sync := dig "status" "sync" "status" "" $app -}}
        {{- $health := dig "status" "health" "status" "" $app -}}
        {{- $state := "other" -}}{{- $label := $health -}}
        {{- $accent := "#2563eb" -}}{{- $tint := "#eff6ff" -}}
        {{- if has $phase (list "Error" "Failed") }}{{ $state = "sync-failed" }}{{ $label = "Sync failed" }}{{ $accent = "#dc2626" }}{{ $tint = "#fef2f2" }}
        {{- else if eq $sync "Unknown" }}{{ $state = "unknown" }}{{ $label = "Comparison error" }}{{ $accent = "#d97706" }}{{ $tint = "#fffbeb" }}
        {{- else if eq $health "Degraded" }}{{ $state = "degraded" }}{{ $label = "Degraded" }}{{ $accent = "#dc2626" }}{{ $tint = "#fef2f2" }}
        {{- else if and (eq $health "Healthy") (eq $sync "Synced") }}{{ $state = "recovered" }}{{ $label = "Recovered" }}{{ $accent = "#16a34a" }}{{ $tint = "#f0fdf4" }}{{ end -}}
        {{- $appUrl := printf "%s/applications/%s/%s" .context.argocdUrl $app.metadata.namespace $app.metadata.name -}}
        {{- $sources := list -}}{{- $revs := list -}}
        {{- with $app.spec.sources }}{{ $sources = . }}{{ $revs = dig "status" "sync" "revisions" (list) $app }}
        {{- else }}{{ with $app.spec.source }}{{ $sources = list . }}{{ $revs = list (dig "status" "sync" "revision" "" $app) }}{{ end }}{{ end -}}
        {{- $commitUrl := "" -}}
        <!DOCTYPE html>
        <html lang="en">
        <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="color-scheme" content="light dark">
        <meta name="supported-color-schemes" content="light dark">
        <style>
          body { margin:0; padding:0; -webkit-text-size-adjust:100%; }
          a { text-decoration:none; }
          @media (prefers-color-scheme: dark) {
            .bg { background:#0b0d12 !important; }
            .card, .hero { background:#151922 !important; }
            .card { border-color:#242a35 !important; }
            .hero { border-left-color:#242a35 !important; border-right-color:#242a35 !important; border-bottom-color:#242a35 !important; }
            .t-strong { color:#e7eaf0 !important; }
            .t-body { color:#a7b0bf !important; }
            .t-muted { color:#6b7585 !important; }
            .chip { background:#1d222c !important; color:#8e98a8 !important; }
            .btn { background:#232a36 !important; color:#e7eaf0 !important; }
            .btn-primary { background:#e7eaf0 !important; color:#0b0d12 !important; }
            .divider { border-color:#242a35 !important; }
            .pill { background:transparent !important; box-shadow:inset 0 0 0 1px currentColor; }
          }
        </style>
        </head>
        <body class="bg" style="margin:0;padding:0;background:#f2f4f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
        <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">
          {{- if eq $state "recovered" }}Healthy and Synced again
          {{- else if eq $state "sync-failed" }}{{ dig "status" "operationState" "message" "" $app | trunc 140 | html }}
          {{- else if eq $state "unknown" }}{{ range dig "status" "conditions" (list) $app }}{{ .message | trunc 140 | html }}{{ break }}{{ end }}
          {{- else }}Health {{ $health }}, sync {{ $sync }}{{ end -}}
        </div>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="bg" style="background:#f2f4f7;">
        <tr><td align="center" style="padding:20px 12px 28px 12px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">

          <tr><td class="t-muted" style="padding:0 4px 10px 4px;font-size:12px;line-height:16px;letter-spacing:0.06em;text-transform:uppercase;color:#94a3b8;font-weight:600;">Argo CD</td></tr>

          <tr><td>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="hero" style="background:#ffffff;border:1px solid #e6e8ec;border-top:5px solid {{ $accent }};border-radius:16px;border-collapse:separate;margin:0 0 12px 0;">
              <tr><td style="padding:18px 18px 20px 18px;">
                <span class="pill" style="display:inline-block;padding:3px 10px;border-radius:999px;background:{{ $tint }};color:{{ $accent }};font-size:12px;line-height:18px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;">{{ if eq $state "recovered" }}✓ {{ else }}● {{ end }}{{ $label }}</span>
                <div class="t-strong" style="margin:12px 0 0 0;font-size:24px;line-height:30px;font-weight:700;color:#0f172a;word-break:break-word;">{{ $app.metadata.name }}</div>
                <div class="t-body" style="margin:6px 0 0 0;font-size:14px;line-height:20px;color:#64748b;">
                  {{- $app.spec.destination.namespace | default $app.spec.destination.name | default $app.spec.destination.server -}}
                </div>
              </td></tr>
            </table>
          </td></tr>

          <tr><td>
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="card" style="background:#ffffff;border:1px solid #e6e8ec;border-radius:14px;margin:0 0 12px 0;border-collapse:separate;">
          <tr><td style="padding:18px 18px 16px 18px;">

            {{- /* Affected resources: failed ones for a failed sync, unhealthy ones otherwise. */}}
            {{- $rows := list }}
            {{- if eq $state "sync-failed" }}
            {{- range dig "status" "operationState" "syncResult" "resources" (list) $app }}
            {{- if or (has .status (list "SyncFailed" "PruneSkipped")) (has (.hookPhase | default "") (list "Failed" "Error")) }}{{ $rows = append $rows . }}{{ end }}
            {{- end }}
            {{- else if ne $state "recovered" }}
            {{- range dig "status" "resources" (list) $app }}
            {{- if and .health (not (has .health.status (list "Healthy" "Progressing" "Suspended"))) }}{{ $rows = append $rows . }}{{ end }}
            {{- end }}
            {{- end }}
            {{- $rfc := "2006-01-02T15:04:05Z07:00" }}
            {{- $since := "" }}{{ $desc := "" }}
            {{- if eq $state "sync-failed" }}{{ $since = dig "status" "operationState" "finishedAt" "" $app }}{{ $desc = dig "status" "operationState" "message" "" $app }}
            {{- else if eq $state "unknown" }}{{ range dig "status" "conditions" (list) $app }}{{ if not $since }}{{ $since = .lastTransitionTime }}{{ $desc = .message }}{{ end }}{{ end }}
            {{- else }}{{ $since = dig "status" "health" "lastTransitionTime" "" $app }}{{ if ne $state "recovered" }}{{ $desc = dig "status" "health" "message" "" $app }}{{ end }}{{ end }}
            {{- $ago := "" }}{{ with $since }}{{ $ago = durationRound (ago (toDate $rfc .)) }}{{ end }}
            {{- /* Recovered: newest problem notification, same entries on-recovered reads. */}}
            {{- $after := "" }}
            {{- if and (eq $state "recovered") $since }}
            {{- $p := 0.0 }}
            {{- range $k, $v := fromJson (dig "metadata" "annotations" "notified.notifications.argoproj.io" "{}" $app) }}
            {{- if and (regexMatch ":on-(sync-failed|health-degraded|sync-status-unknown):" $k) (gt (float64 $v) $p) }}{{ $p = float64 $v }}{{ end }}
            {{- end }}
            {{- if gt $p 0.0 }}{{ $after = durationRound (printf "%ds" (sub (toDate $rfc $since).Unix (int64 $p))) }}{{ end }}
            {{- end }}
            {{- $pc := dict "Healthy" "#16a34a" "Synced" "#16a34a" "Degraded" "#dc2626" "Progressing" "#2563eb" "OutOfSync" "#d97706" "Missing" "#d97706" "Unknown" "#d97706" }}
            {{- $pt := dict "Healthy" "#f0fdf4" "Synced" "#f0fdf4" "Degraded" "#fef2f2" "Progressing" "#eff6ff" "OutOfSync" "#fffbeb" "Missing" "#fffbeb" "Unknown" "#fffbeb" }}

            <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
              <td style="padding:0 8px 0 0;vertical-align:middle;"><div style="width:8px;height:8px;border-radius:4px;background:{{ $accent }};font-size:0;line-height:0;">&nbsp;</div></td>
              <td style="vertical-align:middle;font-size:13px;line-height:18px;font-weight:600;color:{{ $accent }};">
                {{- if eq $state "sync-failed" }}Sync {{ $phase | lower }}{{ with $ago }} {{ . }} ago{{ end }}
                {{- else if eq $state "unknown" }}Unknown{{ with $ago }} for {{ . }}{{ end }}
                {{- else if eq $state "recovered" }}Recovered{{ with $after }} after {{ . }}{{ end }}
                {{- else }}{{ $health }}{{ with $ago }} for {{ . }}{{ end }}{{ end -}}
              </td>
            </tr></table>

            <div class="t-strong" style="margin:10px 0 0 0;font-size:17px;line-height:24px;font-weight:600;color:#0f172a;word-break:break-word;">
              {{- if eq $state "sync-failed" }}{{ if $rows }}{{ with index $rows 0 }}{{ .kind }}/{{ .name }}{{ end }} failed to sync{{ if gt (len $rows) 1 }} (+{{ sub (len $rows) 1 }} more){{ end }}{{ else }}Sync operation {{ $phase | lower }}{{ end }}
              {{- else if eq $state "unknown" }}Argo CD cannot compare this app with git
              {{- else if eq $state "recovered" }}Healthy and Synced again
              {{- else if $rows }}{{ len $rows }} unhealthy resource{{ if gt (len $rows) 1 }}s{{ end }}
              {{- else }}Health is {{ $health }}{{ end -}}
            </div>
            {{- with $desc }}
            <div class="t-body" style="margin:6px 0 0 0;font-size:15px;line-height:22px;color:#475569;word-break:break-word;">{{ . | trunc 600 | html }}</div>
            {{- end }}

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:14px 0 0 0;">
              <tr>
                <td class="t-muted" style="width:96px;padding:3px 0;font-size:13px;line-height:20px;color:#94a3b8;vertical-align:top;">Health</td>
                <td style="padding:3px 0;font-size:14px;line-height:20px;"><span class="pill" style="display:inline-block;padding:0 8px;border-radius:999px;background:{{ get $pt $health | default "#f1f5f9" }};color:{{ get $pc $health | default "#64748b" }};font-size:12px;line-height:20px;font-weight:600;">{{ $health }}</span></td>
              </tr>
              <tr>
                <td class="t-muted" style="width:96px;padding:3px 0;font-size:13px;line-height:20px;color:#94a3b8;vertical-align:top;">Sync</td>
                <td style="padding:3px 0;font-size:14px;line-height:20px;"><span class="pill" style="display:inline-block;padding:0 8px;border-radius:999px;background:{{ get $pt $sync | default "#f1f5f9" }};color:{{ get $pc $sync | default "#64748b" }};font-size:12px;line-height:20px;font-weight:600;">{{ $sync }}</span></td>
              </tr>
              {{- range $i, $s := $sources }}
              {{- $rev := "" }}{{ if lt $i (len $revs) }}{{ $rev = index $revs $i }}{{ end }}
              <tr>
                <td class="t-muted" style="width:96px;padding:3px 0;font-size:13px;line-height:20px;color:#94a3b8;vertical-align:top;">{{ if $s.chart }}Chart{{ else }}Git{{ end }}</td>
                <td class="t-strong" style="padding:3px 0;font-size:14px;line-height:20px;color:#0f172a;word-break:break-all;">
                  {{- if $s.chart }}{{ $s.chart }} <span class="t-muted" style="color:#94a3b8;">{{ $rev | default $s.targetRevision }}</span>
                  {{- else }}{{ $url := call $.repo.RepoURLToHTTPS $s.repoURL | trimSuffix ".git" }}{{ call $.repo.FullNameByRepoURL $s.repoURL }}{{ with $s.path }}<span class="t-muted" style="color:#94a3b8;">/{{ . }}</span>{{ end }}
                  {{- if $rev }} <a href="{{ $url }}/commit/{{ $rev }}" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#2563eb;white-space:nowrap;">{{ trunc 7 $rev }}</a>{{ if not $commitUrl }}{{ $commitUrl = printf "%s/commit/%s" $url $rev }}{{ end }}{{ end }}
                  {{- end -}}
                </td>
              </tr>
              {{- end }}
              {{- with dig "status" "operationState" "finishedAt" "" $app }}
              <tr>
                <td class="t-muted" style="width:96px;padding:3px 0;font-size:13px;line-height:20px;color:#94a3b8;vertical-align:top;">Last sync</td>
                <td class="t-strong" style="padding:3px 0;font-size:14px;line-height:20px;color:#0f172a;">{{ dateInZone "Mon Jan 2, 15:04 MST" (toDate $rfc .) "UTC" }}</td>
              </tr>
              {{- end }}
            </table>

            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:16px 0 0 0;"><tr>
              <td style="padding:0 8px 0 0;"><a class="btn-primary" href="{{ $appUrl }}" style="display:inline-block;padding:9px 14px;border-radius:10px;background:#0f172a;color:#ffffff;font-size:14px;line-height:18px;font-weight:600;text-decoration:none;">Open in Argo CD</a></td>
              {{- with $commitUrl }}
              <td><a class="btn" href="{{ . }}" style="display:inline-block;padding:9px 14px;border-radius:10px;background:#f1f5f9;color:#0f172a;font-size:14px;line-height:18px;font-weight:600;text-decoration:none;">Commit</a></td>
              {{- end }}
            </tr></table>

            {{- if $rows }}
            <div class="divider" style="margin:16px 0 10px 0;border-top:1px solid #eef0f3;font-size:0;line-height:0;">&nbsp;</div>
            {{- range $rows }}
            {{- $rs := .status }}{{ with .health }}{{ $rs = .status }}{{ end }}
            <div style="padding:0 0 8px 0;">
              <span class="chip" style="display:inline-block;padding:2px 7px;border-radius:6px;background:#f4f5f7;color:#64748b;font-size:11px;line-height:16px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;">{{ .kind }}/{{ .name }}</span>
              <span style="white-space:nowrap;font-size:11px;line-height:16px;font-weight:600;color:{{ get $pc $rs | default "#dc2626" }};">{{ $rs }}</span>
              {{- with .message | default (dig "health" "message" "" .) }}
              <div class="t-muted" style="margin:3px 0 0 0;font-size:12px;line-height:17px;color:#94a3b8;word-break:break-word;">{{ . | trunc 300 | html }}</div>
              {{- end }}
            </div>
            {{- end }}
            {{- end }}

          </td></tr>
          </table>
          </td></tr>

          <tr><td align="center" class="t-muted" style="padding:8px 4px 0 4px;font-size:12px;line-height:18px;color:#94a3b8;">
            <a href="{{ .context.argocdUrl }}/applications" style="color:#64748b;text-decoration:underline;">All applications in Argo CD</a>
          </td></tr>

        </table>
        </td></tr>
        </table>
        </body>
        </html>
  # Default subscription for every Application. Per-app subscriptions work too:
  #   notifications.argoproj.io/subscribe.on-sync-failed.smtp: you@example.com
  subscriptions: |
    - recipients:
        - smtp:you@example.com
      triggers:
        - on-sync-failed
        - on-health-degraded
        - on-sync-status-unknown
        - on-recovered
