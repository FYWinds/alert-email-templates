#
# Renders every scenario with the real amtool and argocd CLIs, checks the
# example config and the Argo CD trigger matrix, and publishes the gallery to
# GitHub Pages from main. Pull requests run the same checks without deploying.
name: Preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: preview/build.py
      # amtool, argocd and proxmox-render; versions are pinned in these files.
      - id: tools
        uses: actions/cache@v6
        with:
          path: preview/bin
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('preview/fetch-tools.sh', 'preview/proxmox-render/Cargo.*', 'preview/proxmox-render/src/**') }}
      - name: Fetch amtool and argocd, build proxmox-render
        if: steps.tools.outputs.cache-hit != 'true'
        run: preview/fetch-tools.sh
      - name: Check config, test triggers, render scenarios
        run: uv run preview/build.py
      - name: Generated Proxmox templates are committed
        run: git diff --exit-code -- proxmox/ && test -z "$(git status --porcelain -- proxmox/)"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
